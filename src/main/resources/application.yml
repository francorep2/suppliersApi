spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

    show-sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

encryption:
  key: ${ENCRYPTION_KEY}
  algorithm: AES